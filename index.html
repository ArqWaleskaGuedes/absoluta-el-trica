<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Absoluta Elétrica</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap">
<style>
/* Layout: faixa preta com o logo Absoluta + abas; quadro de obras em colunas (agrupadas por fase) com painel de demandas ao lado.
   Paleta da marca: preto do logo, branco e o cinza do triângulo do "A". */
:root{
  --bg:#f1f1ef; --surface:#ffffff; --surface-2:#e5e4e1; --ink:#121110; --muted:#5f5d59; --line:#d4d3cf;
  --brand:#121110; --brand-2:#1f1e1c; --brand-ink:#ffffff; --logo-gray:#c4c4c2;
  --accent:#f2c200; --accent-ink:#121110; --accent-soft:#fcefb8;
  --danger:#c4382e; --danger-soft:#f8dedb; --ok:#2c7a49; --ok-soft:#dbeedf; --warn:#9a6c00;
  --shadow:0 1px 2px rgba(18,17,16,.08),0 6px 18px rgba(18,17,16,.08);
  --f-display:"Jost","Futura","Century Gothic",Arial,sans-serif;
  --f-body:"Jost","Futura","Century Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0b0a; --surface:#171715; --surface-2:#22211f; --ink:#efeeeb; --muted:#9b9994; --line:#302f2c;
  --brand:#121110; --brand-2:#1f1e1c; --brand-ink:#ffffff; --logo-gray:#c4c4c2;
  --accent:#f5c518; --accent-ink:#121110; --accent-soft:#3a3214;
  --danger:#ec6a5f; --danger-soft:#3a1d1a; --ok:#5cc07c; --ok-soft:#173023; --warn:#e2b04a;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0b0a; --surface:#171715; --surface-2:#22211f; --ink:#efeeeb; --muted:#9b9994; --line:#302f2c;
  --brand:#121110; --brand-2:#1f1e1c; --brand-ink:#ffffff; --logo-gray:#c4c4c2;
  --accent:#f5c518; --accent-ink:#121110; --accent-soft:#3a3214;
  --danger:#ec6a5f; --danger-soft:#3a1d1a; --ok:#5cc07c; --ok-soft:#173023; --warn:#e2b04a;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* topo */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--brand);color:var(--brand-ink)}
.bar{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.mark{display:flex;align-items:center;min-width:0}
.mark img{height:40px;width:auto;display:block}
.tag{font-family:var(--f-display);font-weight:500;letter-spacing:.32em;font-size:13px;color:var(--accent-ink);background:var(--accent);padding:5px 8px 4px 11px;border-radius:2px}
.bar .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.dark{background:var(--brand-2);border-color:transparent;color:var(--brand-ink)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;background:var(--brand-2)}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{color:var(--brand-ink);opacity:.62;text-decoration:none;font-family:var(--f-display);font-weight:500;font-size:13px;letter-spacing:.16em;text-transform:uppercase;padding:10px 14px 8px;border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
nav.tabs a:hover{opacity:1}
nav.tabs a.on{opacity:1;border-bottom-color:var(--accent);color:var(--accent)}
.badge{font-family:var(--f-body);font-size:11px;font-weight:700;background:var(--danger);color:#fff;border-radius:9px;padding:1px 6px;letter-spacing:0}

main{padding-block:18px 60px;display:grid;gap:16px}
h2.vt{font-family:var(--f-display);font-weight:500;font-size:24px;letter-spacing:.14em;text-transform:uppercase;margin:0;text-wrap:balance;line-height:1.05}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar .grow{flex:1}
.datebox{display:flex;align-items:center;gap:4px}
.datebox .lbl{font-family:var(--f-display);font-weight:500;font-size:18px;min-width:0;padding:0 6px;text-transform:capitalize}
.muted{color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}

/* resumo */
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 14px;display:flex;align-items:baseline;gap:8px}
.stat b{font-family:var(--f-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:13px;color:var(--muted)}
.stat.alert{border-color:var(--danger);background:var(--danger-soft)}
.stat.alert b{color:var(--danger)}

/* quadro do dia */
.daygrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;align-items:flex-start;min-width:0}
.col{flex:0 0 250px;background:var(--surface-2);border-radius:8px;display:flex;flex-direction:column;min-height:200px;border:2px dashed transparent;transition:border-color .12s}
.col.drop,.col.target{border-color:var(--accent)}
.col.target{cursor:copy}
.colhead{padding:10px 12px 8px;display:grid;gap:2px;border-top:5px solid var(--oc,var(--muted));border-radius:8px 8px 0 0;background:var(--surface)}
.colhead h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;justify-content:space-between}
.colhead .addr{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.colbody{padding:10px;display:grid;gap:8px;align-content:start;flex:1}
.sub{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;margin-top:4px}
.chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 6px 6px 10px;cursor:grab;user-select:none}
.chip.sel{outline:2px solid var(--accent);outline-offset:1px}
.chip .nm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .fn{font-size:12px;color:var(--muted)}
.turno{font-size:11px;font-weight:700;letter-spacing:.06em;border:1px solid var(--line);background:var(--surface-2);border-radius:4px;padding:2px 6px;min-width:42px}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px;border-radius:4px}
.x:hover{background:var(--surface-2);color:var(--danger)}
.empty{font-size:13px;color:var(--muted);padding:10px;border:1px dashed var(--line);border-radius:6px;text-align:center}

/* demandas */
.dem{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;display:grid;gap:5px;border-left:4px solid var(--oc,var(--line))}
.dem[draggable="true"]{cursor:grab}
.dem.urg{border-color:var(--danger);border-left-color:var(--danger);background:linear-gradient(var(--danger-soft),var(--danger-soft)) top/100% 3px no-repeat,var(--surface)}
.dem.done{opacity:.7}
.dem.sel{outline:2px solid var(--accent);outline-offset:1px}
.dem .t{font-weight:600;line-height:1.25}
.dem .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:10px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.pill.urg{background:var(--danger);color:#fff}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.o{background:var(--oc);color:#fff}
.dem .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.side{background:var(--surface);border:1px solid var(--line);border-radius:8px;display:grid;gap:10px;padding:12px;position:sticky;top:110px;max-height:calc(100vh - 130px);overflow:auto}
.side h3,.lane h3{margin:0;font-family:var(--f-display);font-size:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;align-items:start}
.lane{background:var(--surface-2);border-radius:8px;padding:12px;display:grid;gap:8px;align-content:start}
.lane.urgl{background:var(--danger-soft)}

/* semana */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table.wk{border-collapse:collapse;width:100%;min-width:760px}
.wk th,.wk td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px;vertical-align:top;text-align:left}
.wk th{font-family:var(--f-display);font-weight:500;font-size:14px;letter-spacing:.04em;text-transform:capitalize;background:var(--surface-2)}
.wk th.today{background:var(--accent-soft)}
.wk td.nm{font-weight:600;white-space:nowrap;width:140px}
.wk td.cell{cursor:pointer;min-width:96px;height:52px}
.wk td.cell:hover{background:var(--surface-2)}
.wk td.cell.today{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
.cellpills{display:flex;flex-wrap:wrap;gap:4px}
.wk tr.foot td{background:var(--surface-2);font-size:12px;color:var(--muted)}

/* mês */
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.month .dh{font-family:var(--f-display);font-weight:500;text-transform:uppercase;font-size:13px;letter-spacing:.08em;color:var(--muted);padding:4px 6px}
.mday{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-height:92px;padding:6px;display:grid;gap:4px;align-content:start;text-align:left;cursor:pointer}
.mday:hover{border-color:var(--muted)}
.mday.out{opacity:.4}
.mday.today{border:2px solid var(--accent)}
.mday .n{font-family:var(--f-display);font-weight:600;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.mday .pill{font-size:10px;padding:1px 5px}

/* listas */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:6px;align-content:start}
.card h4{margin:0;font-family:var(--f-display);font-weight:600;font-size:19px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.card.off{opacity:.55}
.sw{width:14px;height:14px;border-radius:3px;background:var(--oc);display:inline-block;flex:none}
.route{display:grid;gap:0}
.stop{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start}
.stop .dot{width:14px;height:14px;border-radius:50%;background:var(--oc,var(--muted));margin:4px 4px 0;position:relative}
.stop:not(:last-child) .dot::after{content:"";position:absolute;left:6px;top:14px;width:2px;height:30px;background:var(--line)}
.stop .s{padding-bottom:12px;min-width:0}
.stop .s b{display:block}
.stop .s span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
a.lnk{color:var(--ink);font-weight:600}

/* modal / toast */
.ov{position:fixed;inset:0;background:rgba(8,14,20,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(40px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.modal{background:var(--surface);border-radius:10px;width:min(480px,100%);box-shadow:var(--shadow);display:grid}
.modal header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal header h3{margin:0;font-family:var(--f-display);font-size:16px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.modal form{padding:16px 18px;display:grid;gap:12px}
.fld{display:grid;gap:4px}
.fld label,.lab{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:9px 10px;width:100%}
.fld textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:8px;align-items:center;font-weight:500}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{border:1px solid var(--line);border-radius:6px;padding:5px 9px;display:flex;gap:6px;align-items:center;font-size:14px}
.checks label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg label{flex:1;text-align:center;padding:7px 4px;font-weight:600;font-size:13px;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--brand);color:var(--brand-ink)}
.obrabtns{display:grid;gap:6px}
.obrabtns button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 12px;font-weight:600;text-align:left}
.obrabtns button:hover{border-color:var(--oc)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches label{width:30px;height:30px;border-radius:6px;background:var(--oc);cursor:pointer;border:2px solid transparent}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches label:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface)}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding-top:4px}
.mfoot .left{margin-right:auto}
.fase{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.fase.execucao{color:var(--ink)}
.grp{display:grid;gap:10px}
.grp>h3{margin:0;font-family:var(--f-display);font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center}
.grp>h3::after{content:"";flex:1;height:1px;background:var(--line)}
.grp>h3::before{content:"";width:10px;height:10px;background:var(--accent);clip-path:polygon(50% 0,100% 100%,0 100%)}
h2.vt{border-left:4px solid var(--accent);padding-left:10px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--brand);color:var(--brand-ink);padding:10px 16px;border-radius:8px;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--accent);color:var(--accent-ink);font-weight:600;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;justify-content:space-between}
.vis{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:start;background:var(--accent-soft);border:1px dashed var(--accent);border-radius:6px;padding:7px 6px 7px 8px}
.vis.done{opacity:.6}
.vis .hr{font-weight:600;font-variant-numeric:tabular-nums;font-size:13px;padding-top:1px}
.vis .vb{min-width:0;display:grid;gap:2px}
.vis .vb b{font-size:13px;font-weight:600}
.vis .vb span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.vis .va{display:flex}
.addvis{border:1px dashed var(--line);background:transparent;border-radius:6px;padding:6px;font-size:13px;color:var(--muted)}
.addvis:hover{border-color:var(--accent);color:var(--ink)}
.pill.vp{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--oc)}
.stop .dot.hol{background:var(--surface);box-shadow:inset 0 0 0 3px var(--oc)}
.stop .acts{display:flex;gap:6px;margin-top:4px}
.col.bicos{flex-basis:220px;background:transparent;border:2px dashed var(--line)}
.col.bicos .colhead{border-top-color:var(--line);background:transparent}
.mini{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--oc);border-radius:6px;padding:8px;display:grid;gap:6px}
.mini.drop,.mini.target{outline:2px solid var(--accent);outline-offset:1px}
.mini.target{cursor:copy}
.mini .mh{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.mini .addvis{padding:3px;font-size:12px}
.resp{font-size:12px;letter-spacing:.06em;opacity:.8;white-space:nowrap}
.resp b{color:var(--accent);font-weight:600}
.lead{background:var(--brand);color:var(--brand-ink);border-radius:10px;padding:16px 18px;display:grid;grid-template-columns:minmax(180px,auto) minmax(0,1fr) auto;gap:20px;align-items:start;border-left:6px solid var(--accent)}
.lead .lid{display:flex;gap:12px;align-items:center}
.lead .av{width:52px;height:52px;border-radius:50%;background:var(--accent);color:#121110;display:grid;place-items:center;font-size:24px;font-weight:600;flex:none}
.lead h3{margin:0;font-size:26px;font-weight:600;letter-spacing:.04em;line-height:1.1}
.lead .role{font-size:13px;opacity:.7}
.crown{font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.lead .crown{display:block}
.lagenda{display:grid;gap:6px;min-width:0}
.lab2{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;opacity:.6}
.ag{display:grid;grid-template-columns:48px 12px minmax(0,1fr) auto;gap:8px;align-items:center;background:rgba(255,255,255,.07);border-radius:6px;padding:7px 8px}
.ag.none{display:block;opacity:.7;font-size:13px}
.ag.ok{opacity:.55}
.ag .hr{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
.ag .sw{width:12px;height:12px}
.ag .tx{min-width:0;display:grid}
.ag .tx b{font-weight:600;font-size:14px}
.ag .tx span{font-size:12px;opacity:.7;overflow-wrap:anywhere}
.tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--accent);background:transparent;color:var(--accent);font-weight:700;padding:0;line-height:1}
.lside{display:grid;gap:12px;justify-items:end}
.lnums{display:flex;gap:16px}
.lnums div{display:grid;justify-items:end}
.lnums b{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.lnums span{font-size:11px;opacity:.65;text-transform:uppercase;letter-spacing:.08em}
.lnums .hot b{color:#ff7a6e}
.lbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn.dk{background:transparent;color:var(--brand-ink);border-color:rgba(255,255,255,.3);text-decoration:none}
.btn.dk:hover{border-color:var(--accent)}
.card.bosscard{border:2px solid var(--accent);box-shadow:var(--shadow)}
.wk tr.bossrow td{background:var(--accent-soft)}
.wk tr.bossrow td.nm{border-left:4px solid var(--accent)}
@media (max-width:900px){.lead{grid-template-columns:1fr}.lside{justify-items:start}.lnums div{justify-items:start}.lbtns{justify-content:flex-start}}
.notice{background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:12px 14px}

@media (max-width:900px){
  .daygrid{grid-template-columns:1fr}
  .side{position:static;max-height:none}
}
@media (max-width:520px){
  .mark small{display:none}
  h2.vt{font-size:24px}

<script>
const PAL=['#3d5a80','#4a7a5f','#a0573a','#6b5b95','#8c7632','#3f7f8c','#8f4a68','#5a6b34'];
const FASES=[['execucao','Em execução'],['finalizacao','Finalização'],['bicos','Bicos (pouca demanda)'],['proxima','Próximas']];
const FI=f=>{const i=FASES.findIndex(x=>x[0]===f);return i<0?9:i};const FL=f=>(FASES.find(x=>x[0]===f)||[,''])[1];
const TABS=[['dia','Dia'],['semana','Semana'],['mes','Mês'],['demandas','Demandas'],['rotas','Rotas'],['equipe','Equipe'],['obras','Obras']];
const TURNOS={D:'Dia todo',M:'Manhã',T:'Tarde'};
const S={view:'dia',day:ds(new Date()),week:null,month:null,equipe:[],obras:[],aloc:[],dem:[],vis:[],cfg:{},loaded:{},db:null,offline:false,sel:null};
S.week=ds(monday(new Date()));S.month=ds(new Date()).slice(0,7);

/* ---------- datas ---------- */
function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pd(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function add(s,n){const d=pd(s);d.setDate(d.getDate()+n);return ds(d)}
function monday(d){const x=new Date(d);const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x}
function today(){return ds(new Date())}
const fDay=s=>pd(s).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'}).replace(/\./g,'');
const fLong=s=>pd(s).toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
const fShort=s=>pd(s).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
function prevWorkday(s){let p=add(s,-1);if(pd(p).getDay()===0)p=add(p,-1);return p}

/* ---------- util ---------- */
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
const obra=id=>S.obras.find(o=>o.id===id);
const func=id=>S.equipe.find(f=>f.id===id);
const ocor=o=>o?.cor||'var(--muted)';
const activeObras=()=>S.obras.filter(o=>o.ativa!==false).sort((a,b)=>FI(a.fase)-FI(b.fase)||(a.ordem??99)-(b.ordem??99)||String(a.nome).localeCompare(b.nome));
const isBoss=f=>!!f&&/engenheir|encarregad/i.test(f.funcao||'');
const activeEquipe=()=>S.equipe.filter(f=>f.ativo!==false).sort((a,b)=>isBoss(b)-isBoss(a)||String(a.nome).localeCompare(b.nome));
const boss=()=>activeEquipe().find(isBoss);
const alocDay=d=>S.aloc.filter(a=>a.data===d);
const TORD={M:0,D:1,T:2};
function sigla(o){return o?(o.sigla||String(o.nome||'?').slice(0,3).toUpperCase()):'?'}
function canWrite(){if(!S.db){toast('Sem conexão com a base de dados.');return false}return true}
async function W(p){try{await p}catch(e){toast(e&&e.code==='invalid_argument'?'Sem permissão para editar. Peça acesso de Colaborador.':'Não salvou: '+(e?.message||e?.code||e))}}
const col=n=>S.db.collection(n);
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- ações de alocação ---------- */
function freeTurnos(fid,d){const as=S.aloc.filter(a=>a.data===d&&a.funcId===fid);if(!as.length)return'D';if(as.some(a=>a.turno==='D'))return null;const has=new Set(as.map(a=>a.turno));if(has.has('M')&&has.has('T'))return null;return has.has('M')?'T':'M'}
async function assignFunc(fid,oid,d){if(!canWrite())return;const t=freeTurnos(fid,d);if(!t){toast('Já está alocado o dia todo.');return}await W(col('alocacoes').doc(newId()).set({data:d,funcId:fid,obraId:oid,turno:t}))}
async function moveAloc(aid,oid){if(!canWrite())return;await W(col('alocacoes').doc(aid).update({obraId:oid}))}
async function delAloc(aid){if(!canWrite())return;await W(col('alocacoes').doc(aid).delete())}
async function cycleTurno(aid){if(!canWrite())return;const a=S.aloc.find(x=>x.id===aid);if(!a)return;const nx={D:'M',M:'T',T:'D'}[a.turno||'D'];await W(col('alocacoes').doc(aid).update({turno:nx}))}
async function setCell(fid,d,oid,turno){if(!canWrite())return;const as=S.aloc.filter(a=>a.data===d&&a.funcId===fid);for(const a of as){if(turno==='D'||a.turno==='D'||a.turno===turno)await W(col('alocacoes').doc(a.id).delete())}if(oid)await W(col('alocacoes').doc(newId()).set({data:d,funcId:fid,obraId:oid,turno}))}
async function copyDay(from,to){if(!canWrite())return;const src=alocDay(from);if(!src.length){toast('Nada alocado em '+fShort(from)+'.');return}let n=0;for(const a of src){if(S.aloc.some(x=>x.data===to&&x.funcId===a.funcId))continue;await W(col('alocacoes').doc(newId()).set({data:to,funcId:a.funcId,obraId:a.obraId,turno:a.turno||'D'}));n++}toast(n?n+' alocações copiadas de '+fShort(from)+'.':'Todos já estavam alocados.')}
async function copyWeek(){const ws=S.week;let tot=0;for(let i=0;i<6;i++){const to=add(ws,i),from=add(ws,i-7);for(const a of alocDay(from)){if(S.aloc.some(x=>x.data===to&&x.funcId===a.funcId))continue;await W(col('alocacoes').doc(newId()).set({data:to,funcId:a.funcId,obraId:a.obraId,turno:a.turno||'D'}));tot++}}toast(tot?tot+' alocações copiadas da semana anterior.':'Nada novo para copiar.')}

/* ---------- ações de demanda ---------- */
async function scheduleDem(id,d,oid,funcs,alocar){if(!canWrite())return;const p={data:d,status:'agendada'};if(oid)p.obraId=oid;if(funcs)p.funcIds=funcs;await W(col('demandas').doc(id).update(p));if(alocar&&oid&&funcs){for(const f of funcs){if(!S.aloc.some(a=>a.data===d&&a.funcId===f))await W(col('alocacoes').doc(newId()).set({data:d,funcId:f,obraId:oid,turno:'D'}))}}toast('Demanda agendada para '+fShort(d)+'.')}
async function concluir(id){if(!canWrite())return;await W(col('demandas').doc(id).update({status:'concluida',concluidaEm:today()}));toast('Demanda concluída.')}
async function reabrir(id){if(!canWrite())return;await W(col('demandas').doc(id).update({status:'aberta',data:null}))}
async function toggleUrg(id){if(!canWrite())return;const d=S.dem.find(x=>x.id===id);await W(col('demandas').doc(id).update({urgente:!d.urgente}))}
async function desagendar(id){if(!canWrite())return;await W(col('demandas').doc(id).update({status:'aberta',data:null}))}
const TIPOS=['Reunião','Passada','Vistoria','Medição','Outro'];
const visDay=d=>S.vis.filter(v=>v.data===d).sort((a,b)=>String(a.hora||'99').localeCompare(String(b.hora||'99')));
async function visDone(id){if(!canWrite())return;const v=S.vis.find(x=>x.id===id);await W(col('visitas').doc(id).update({feito:!v.feito}))}
function visCard(v){const f=func(v.funcId);return `<div class="vis ${v.feito?'done':''}"><span class="hr">${esc(v.hora||'—')}</span><div class="vb"><b>${esc(v.tipo)} · ${esc(f?.nome||'?')}</b>${v.motivo?`<span>${esc(v.motivo)}</span>`:''}</div><div class="va"><button class="x" type="button" data-act="visDone" data-id="${v.id}" title="${v.feito?'Desmarcar':'Marcar como feito'}" aria-label="Feito">${v.feito?'✓':'○'}</button><button class="x" type="button" data-act="editVis" data-id="${v.id}" aria-label="Editar">✎</button></div></div>`}
function defaultBoss(){const eq=activeEquipe();return (boss()||eq[0]||{}).id}
function leadPanel(d){
  const b=boss();if(!b)return '';
  const st=routeStops(b.id,d);const p=pend();const nu=p.filter(x=>x.urgente).length;
  const vv=visDay(d).filter(v=>v.funcId===b.id);const feitas=vv.filter(v=>v.feito).length;
  const url=mapsUrl(dedupe(st.map(x=>x.o)));
  const hj=d===today();
  return `<section class="lead">
    <div class="lid"><span class="av">${esc(String(b.nome||'?').charAt(0))}</span><div><span class="crown">Responsável pelo painel</span><h3>${esc(b.nome)}</h3><span class="role">${esc(b.funcao||'')}${b.obs?' · '+esc(b.obs):''}</span></div></div>
    <div class="lagenda"><span class="lab2">Agenda ${hj?'de hoje':'de '+fShort(d)}</span>${st.length?st.map(x=>`<div class="ag ${x.vis&&x.vis.feito?'ok':''}"><span class="hr">${x.vis?esc(x.vis.hora||'—'):(x.t==='13:00'?'tarde':'manhã')}</span><span class="sw" style="--oc:${ocor(x.o)}"></span><div class="tx"><b>${x.vis?esc(x.vis.tipo)+' · ':''}${esc(x.o.nome)}</b>${x.vis&&x.vis.motivo?`<span>${esc(x.vis.motivo)}</span>`:''}</div>${x.vis?`<button class="tick" type="button" data-act="visDone" data-id="${x.vis.id}" aria-label="Marcar feito">${x.vis.feito?'✓':''}</button>`:''}</div>`).join(''):'<div class="ag none">Nada marcado. Use “Encaixar visita” quando surgir uma reunião ou passada.</div>'}</div>
    <div class="lside"><div class="lnums"><div><b>${vv.length?feitas+'/'+vv.length:'0'}</b><span>visitas feitas</span></div><div class="${nu?'hot':''}"><b>${nu}</b><span>urgentes</span></div><div><b>${p.length-nu}</b><span>na fila</span></div></div>
      <div class="lbtns"><button class="btn pri" type="button" data-act="visFor" data-id="${b.id}">+ Encaixar visita / reunião</button><button class="btn dk" type="button" data-act="novaDem">+ Demanda</button>${url?`<a class="btn dk" href="${url}" target="_blank" rel="noopener">Rota no Maps</a>`:''}</div></div>
  </section>`;
}
const pend=()=>S.dem.filter(d=>d.status==='aberta'||!d.status).sort((a,b)=>(b.urgente?1:0)-(a.urgente?1:0)||String(a.criadoEm||'').localeCompare(String(b.criadoEm||'')));

/* ---------- render ---------- */
let raf=0;function render(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;draw()})}
function draw(){
  const urg=S.dem.filter(d=>d.urgente&&d.status!=='concluida').length;
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<a href="#${k}" class="${S.view===k?'on':''}" data-tab="${k}">${l}${k==='demandas'&&urg?`<span class="badge">${urg}</span>`:''}</a>`).join('');

  const fn={dia:vDia,semana:vSemana,mes:vMes,demandas:vDem,rotas:vRotas,equipe:vEquipe,obras:vObras}[S.view]||vDia;
  m.innerHTML=fn();
  {const b=boss();const r=document.getElementById('resp');if(r)r.innerHTML=b?'Responsável: <b>'+esc(b.nome)+'</b>':'';}

function drawSel(){
  const r=$('#selRoot');

}

function chipFunc(f,a,extra){
  const t=a?a.turno||'D':null;
  return `<div class="chip ${S.sel&&((a&&S.sel.id===a.id)||(!a&&S.sel.id===f.id))?'sel':''}" draggable="true" data-drag="${a?'aloc:'+a.id:'func:'+f.id}" data-pick="${a?'aloc:'+a.id:'func:'+f.id}">
    <span class="nm">${esc(f?.nome||'(removido)')}</span>${extra||''}
    ${a?`<button class="turno" type="button" data-act="turno" data-id="${a.id}" title="Trocar turno">${t==='D'?'DIA':t==='M'?'MANHÃ':'TARDE'}</button><button class="x" type="button" data-act="unaloc" data-id="${a.id}" aria-label="Tirar da obra">×</button>`:''}
  </div>`;
}
function demCard(d,o={}){
  const ob=obra(d.obraId);
  const fs=(d.funcIds||[]).map(id=>func(id)?.nome).filter(Boolean);
  const isP=d.status==='aberta'||!d.status;
  return `<div class="dem ${d.urgente&&d.status!=='concluida'?'urg':''} ${d.status==='concluida'?'done':''} ${S.sel&&S.sel.id===d.id?'sel':''}" style="--oc:${ob?ocor(ob):'var(--line)'}" ${isP?`draggable="true" data-drag="dem:${d.id}"`:''}>
    <div class="t">${esc(d.titulo)}</div>
    <div class="meta">${d.urgente&&d.status!=='concluida'?'<span class="pill urg">URGENTE</span>':''}${ob?`<span class="pill o" style="--oc:${ocor(ob)}">${esc(sigla(ob))}</span>`:'<span class="pill">Sem obra</span>'}${d.data&&d.status==='agendada'?`<span>${fDay(d.data)}</span>`:''}${d.status==='concluida'?`<span class="pill ok">Concluída ${d.concluidaEm?fShort(d.concluidaEm):''}</span>`:''}${fs.length?`<span>${esc(fs.join(', '))}</span>`:''}${d.solicitante?`<span>por ${esc(d.solicitante)}</span>`:''}</div>
    ${d.descricao&&o.full?`<div class="hint">${esc(d.descricao)}</div>`:''}
    <div class="acts">
      ${isP&&o.pick?`<button class="btn sm" type="button" data-act="pickDem" data-id="${d.id}">Colocar no dia</button>`:''}
      ${isP&&!o.pick?`<button class="btn sm" type="button" data-act="agendar" data-id="${d.id}">Agendar</button>`:''}
      ${d.status==='agendada'?`<button class="btn sm" type="button" data-act="concluir" data-id="${d.id}">Concluir</button>`:''}
      ${d.status==='agendada'&&o.full?`<button class="btn sm ghost" type="button" data-act="desagendar" data-id="${d.id}">Voltar p/ fila</button>`:''}
      ${d.status!=='concluida'&&o.full?`<button class="btn sm ghost" type="button" data-act="urg" data-id="${d.id}">${d.urgente?'Tirar urgência':'Urgente'}</button>`:''}
      ${d.status==='concluida'?`<button class="btn sm ghost" type="button" data-act="reabrir" data-id="${d.id}">Reabrir</button>`:''}
      <button class="btn sm ghost" type="button" data-act="editDem" data-id="${d.id}">Editar</button>
    </div>
  </div>`;
}

function datebox(lbl,prev,next,todayAct){return `<div class="datebox"><button class="btn sm" type="button" data-act="${prev}" aria-label="Anterior">‹</button><span class="lbl">${lbl}</span><button class="btn sm" type="button" data-act="${next}" aria-label="Próximo">›</button>${todayAct?`<button class="btn sm ghost" type="button" data-act="${todayAct}">Hoje</button>`:''}</div>`}
function loading(){return !(S.loaded.equipe&&S.loaded.obras)}

function vDia(){
  if(loading())return '<p class="muted">Carregando…</p>';
  const d=S.day,as=alocDay(d),obs=activeObras(),eq=activeEquipe();
  const onSite=new Set(as.map(a=>a.funcId)).size;
  const livres=eq.filter(f=>freeTurnos(f.id,d));
  const p=pend(),nu=p.filter(x=>x.urgente).length;
  const agDay=S.dem.filter(x=>x.status==='agendada'&&x.data===d);
  const cols=[`<section class="col" data-drop="livre" style="--oc:var(--muted)"><div class="colhead"><h3>Disponíveis <span class="count">${livres.length}</span></h3><div class="addr">Sem obra ${d===today()?'hoje':'neste dia'}</div></div><div class="colbody">${livres.length?livres.map(f=>{const t=freeTurnos(f.id,d);return chipFunc(f,null,t!=='D'?`<span class="fn">${t==='M'?'manhã livre':'tarde livre'}</span>`:`<span class="fn">${esc(f.funcao||'')}</span>`)}).join(''):'<div class="empty">Todos alocados</div>'}</div></section>`];
  const main=obs.filter(o=>o.fase!=='bicos'),bic=obs.filter(o=>o.fase==='bicos');
  for(const o of main){
    const oa=as.filter(a=>a.obraId===o.id).sort((a,b)=>TORD[a.turno||'D']-TORD[b.turno||'D']);
    const od=agDay.filter(x=>x.obraId===o.id);
    cols.push(`<section class="col ${S.sel?'target':''}" data-drop="${o.id}" style="--oc:${ocor(o)}"><div class="colhead">${o.fase?`<span class="fase ${o.fase}">${FL(o.fase)}</span>`:''}<h3><span>${esc(o.nome)}</span><span class="count">${oa.length} ${oa.length===1?'pessoa':'pessoas'}</span></h3><div class="addr" title="${esc(o.endereco)}">${esc(o.endereco||'Endereço não cadastrado')}</div></div><div class="colbody">${oa.length?oa.map(a=>chipFunc(func(a.funcId),a)).join(''):'<div class="empty">Arraste eletricistas para cá</div>'}${(()=>{const vv=visDay(d).filter(v=>v.obraId===o.id);return vv.length?`<div class="sub">Visitas e reuniões</div>${vv.map(visCard).join('')}`:''})()}<button class="addvis" type="button" data-act="novaVis" data-obra="${o.id}">+ visita / reunião</button>${od.length?`<div class="sub">Demandas do dia</div>${od.map(x=>demCard(x)).join('')}`:''}</div></section>`);
  }
  if(bic.length)cols.push(`<section class="col bicos"><div class="colhead"><span class="fase">Bicos</span><h3><span>Obras de bico</span></h3><div class="addr">Pouca demanda · só quando precisar</div></div><div class="colbody">${bic.map(o=>{const oa=as.filter(a=>a.obraId===o.id);const vv=visDay(d).filter(v=>v.obraId===o.id);const od=agDay.filter(x=>x.obraId===o.id);
    return `<div class="mini ${S.sel?'target':''}" data-drop="${o.id}" style="--oc:${ocor(o)}"><div class="mh"><b>${esc(o.nome)}</b>${oa.length||vv.length||od.length?`<span class="count">${oa.length}p · ${vv.length}v</span>`:'<span class="count">livre</span>'}</div>${oa.map(a=>chipFunc(func(a.funcId),a)).join('')}${vv.map(visCard).join('')}${od.map(x=>demCard(x)).join('')}<button class="addvis" type="button" data-act="novaVis" data-obra="${o.id}">+ visita</button></div>`}).join('')}</div></section>`);
  const semObra=agDay.filter(x=>!x.obraId||!obs.some(o=>o.id===x.obraId));
  return `
  <div class="toolbar"><h2 class="vt">Programação do dia</h2><span class="grow"></span>${datebox(fLong(d),'dPrev','dNext','dToday')}</div>
  ${leadPanel(d)}
  <div class="toolbar"><div class="stats">
    <div class="stat"><b>${onSite}</b><span>em obra</span></div>
    <div class="stat"><b>${livres.length}</b><span>disponíveis</span></div>
    <div class="stat ${nu?'alert':''}"><b>${nu}</b><span>urgentes</span></div>
    <div class="stat"><b>${p.length-nu}</b><span>na fila</span></div>
    <div class="stat"><b>${visDay(d).length}</b><span>visitas</span></div>
  </div><span class="grow"></span><button class="btn pri" type="button" data-act="novaVis">+ Visita / reunião</button><button class="btn" type="button" data-act="copyPrev">Repetir ${fShort(prevWorkday(d))}</button></div>
  ${!obs.length?'<div class="notice">Nenhuma obra ativa. Cadastre em <a class="lnk" href="#obras">Obras</a>.</div>':''}
  <div class="daygrid">

      ${p.length?p.map(x=>demCard(x,{pick:true})).join(''):'<div class="empty">Nenhuma demanda pendente.<br>Use “+ Demanda” para registrar.</div>'}
      ${semObra.length?`<div class="sub">Agendadas sem obra ativa</div>${semObra.map(x=>demCard(x)).join('')}`:''}
    </aside>
  </div>`;
}

function vSemana(){
  if(loading())return '<p class="muted">Carregando…</p>';
  const ws=S.week,days=[...Array(6)].map((_,i)=>add(ws,i)),eq=activeEquipe(),t=today();
  const head=days.map(d=>`<th class="${d===t?'today':''}">${fDay(d)}</th>`).join('');
  const rows=eq.map(f=>`<tr class="${isBoss(f)?'bossrow':''}"><td class="nm">${esc(f.nome)}<div class="hint">${esc(f.funcao||'')}</div></td>${days.map(d=>{const as=S.aloc.filter(a=>a.data===d&&a.funcId===f.id).sort((a,b)=>TORD[a.turno||'D']-TORD[b.turno||'D']);const vv=visDay(d).filter(v=>v.funcId===f.id);return `<td class="cell ${d===t?'today':''}" data-act="cell" data-f="${f.id}" data-d="${d}"><div class="cellpills">${as.map(a=>{const o=obra(a.obraId);return `<span class="pill o" style="--oc:${ocor(o)}">${esc(sigla(o))}${a.turno&&a.turno!=='D'?' · '+a.turno:''}</span>`}).join('')}${vv.map(v=>{const o=obra(v.obraId);return `<span class="pill vp" style="--oc:${ocor(o)}" title="${esc(v.tipo)}: ${esc(v.motivo)}">${esc(sigla(o))}${v.hora?' '+esc(v.hora):''}</span>`}).join('')}${!as.length&&!vv.length?'<span class="muted">—</span>':''}</div></td>`}).join('')}</tr>`).join('');
  const foot=`<tr class="foot"><td>Demandas</td>${days.map(d=>{const n=S.dem.filter(x=>x.status!=='concluida'&&x.data===d).length;const u=S.dem.filter(x=>x.status!=='concluida'&&x.data===d&&x.urgente).length;return `<td>${n?n+' agendada'+(n>1?'s':''):''}${u?` <span class="pill urg">${u} urg.</span>`:''}</td>`}).join('')}</tr>`;
  const legend=activeObras().map(o=>`<span class="pill o" style="--oc:${ocor(o)}">${esc(sigla(o))}</span> <span class="hint">${esc(o.nome)}</span>`).join(' &nbsp; ');
  return `<div class="toolbar"><h2 class="vt">Cronograma semanal</h2><span class="grow"></span>${datebox(fShort(ws)+' – '+fShort(add(ws,5)),'wPrev','wNext','wToday')}</div>
  <div class="toolbar"><span class="hint">Toque numa célula para escolher a obra e o turno. Etiqueta vazada = visita ou reunião.</span><span class="grow"></span><button class="btn" type="button" data-act="copyWeek">Copiar semana anterior</button></div>
  ${eq.length?`<div class="tablewrap"><table class="wk"><thead><tr><th>Equipe</th>${head}</tr></thead><tbody>${rows}${foot}</tbody></table></div>`:'<div class="notice">Cadastre a equipe em <a class="lnk" href="#equipe">Equipe</a>.</div>'}
  <div>${legend}</div>`;
}

function vMes(){
  if(loading())return '<p class="muted">Carregando…</p>';
  const [y,mo]=S.month.split('-').map(Number);const first=new Date(y,mo-1,1);const start=ds(monday(first));const t=today();
  const lbl=first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  let cells='';
  for(let i=0;i<42;i++){const d=add(start,i);const inM=pd(d).getMonth()===mo-1;
    const as=alocDay(d);const by={};as.forEach(a=>{by[a.obraId]=(by[a.obraId]||new Set()).add(a.funcId)});
    const dm=S.dem.filter(x=>x.status!=='concluida'&&x.data===d);const u=dm.filter(x=>x.urgente).length;
    cells+=`<button type="button" class="mday ${inM?'':'out'} ${d===t?'today':''}" data-act="goDay" data-d="${d}"><span class="n">${pd(d).getDate()}${u?`<span class="pill urg">${u}</span>`:''}</span>${Object.entries(by).map(([oid,s])=>{const o=obra(oid);return `<span class="pill o" style="--oc:${ocor(o)}">${esc(sigla(o))} ${s.size}</span>`}).join('')}${dm.length-u>0?`<span class="hint">${dm.length-u} dem.</span>`:''}${visDay(d).length?`<span class="hint">${visDay(d).length} visita${visDay(d).length>1?'s':''}</span>`:''}</button>`;
    if(i>=34&&pd(add(start,i+1)).getMonth()!==mo-1&&(i+1)%7===0)break;}
  return `<div class="toolbar"><h2 class="vt">Cronograma mensal</h2><span class="grow"></span>${datebox(lbl,'mPrev','mNext','mToday')}</div>
  <div class="hint">Cada etiqueta mostra a obra e quantas pessoas estão nela. Vermelho = demandas urgentes no dia. Toque no dia para abrir.</div>
  <div class="month">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(x=>`<div class="dh">${x}</div>`).join('')}${cells}</div>`;
}

function vDem(){
  if(!S.loaded.demandas)return '<p class="muted">Carregando…</p>';
  const p=pend(),urg=p.filter(d=>d.urgente),fila=p.filter(d=>!d.urgente);
  const ag=S.dem.filter(d=>d.status==='agendada').sort((a,b)=>String(a.data).localeCompare(String(b.data)));
  const dn=S.dem.filter(d=>d.status==='concluida').sort((a,b)=>String(b.concluidaEm||'').localeCompare(String(a.concluidaEm||''))).slice(0,20);
  const lane=(t,arr,cls,emp)=>`<section class="lane ${cls||''}"><h3>${t} <span class="count">${arr.length}</span></h3>${arr.length?arr.map(d=>demCard(d,{full:true})).join(''):`<div class="empty">${emp}</div>`}</section>`;
  return `<div class="toolbar"><h2 class="vt">Demandas</h2><span class="grow"></span><button class="btn pri" type="button" data-act="novaDem">+ Nova demanda</button></div>
  <div class="lanes">${lane('Urgentes',urg,'urgl','Nenhuma urgência.')}${lane('Fila sem previsão',fila,'','Fila vazia.')}${lane('Agendadas',ag,'','Nada agendado.')}${lane('Concluídas',dn,'','Nenhuma concluída ainda.')}</div>`;
}

function mapsUrl(stops){const o=S.cfg.partida||'';const pts=stops.map(s=>s.endereco||s.nome);if(!pts.length)return'';const dest=pts[pts.length-1],mid=pts.slice(0,-1);let u='https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+encodeURIComponent(dest);if(o)u+='&origin='+encodeURIComponent(o);if(mid.length)u+='&waypoints='+encodeURIComponent(mid.join('|'));return u}
function routeStops(fid,d){
  const st=[];
  alocDay(d).filter(a=>a.funcId===fid).forEach(a=>{const o=obra(a.obraId);if(o)st.push({o,t:(a.turno==='T'?'13:00':'07:00'),title:o.nome+' · '+TURNOS[a.turno||'D'],sub:o.endereco||'Sem endereço'})});
  visDay(d).filter(v=>v.funcId===fid).forEach(v=>{const o=obra(v.obraId);if(o)st.push({o,t:v.hora||'12:00',vis:v,title:(v.hora?v.hora+' · ':'')+v.tipo+' · '+o.nome,sub:(v.motivo?v.motivo+' — ':'')+(o.endereco||'Sem endereço')})});
  return st.sort((a,b)=>a.t.localeCompare(b.t));
}
const dedupe=os=>os.filter((o,i)=>i===0||os[i-1].id!==o.id);
function vRotas(){
  if(loading())return '<p class="muted">Carregando…</p>';
  const d=S.day;
  const fids=[...new Set([...alocDay(d).map(a=>a.funcId),...visDay(d).map(v=>v.funcId)])].filter(func).sort((a,b)=>isBoss(func(b))-isBoss(func(a))||String(func(a).nome).localeCompare(func(b).nome));
  const cards=fids.map(fid=>{const st=routeStops(fid,d);const url=mapsUrl(dedupe(st.map(x=>x.o)));
    return `<div class="card ${isBoss(func(fid))?'bosscard':''}">${isBoss(func(fid))?'<span class="crown">Responsável</span>':''}<h4>${esc(func(fid).nome)}<span class="count">${st.length} ${st.length===1?'parada':'paradas'}</span></h4>
    <div class="hint">${esc(func(fid).funcao||'')}</div>
    <div class="route">${S.cfg.partida?`<div class="stop"><span class="dot" style="--oc:var(--ink)"></span><div class="s"><b>Saída</b><span>${esc(S.cfg.partida)}</span></div></div>`:''}${st.map(x=>`<div class="stop"><span class="dot ${x.vis?'hol':''}" style="--oc:${ocor(x.o)}"></span><div class="s"><b>${esc(x.title)}${x.vis&&x.vis.feito?' <span class="pill ok">feito</span>':''}</b><span>${esc(x.sub)}</span>${x.vis?`<div class="acts"><button class="btn sm" type="button" data-act="visDone" data-id="${x.vis.id}">${x.vis.feito?'Desmarcar':'Feito'}</button><button class="btn sm ghost" type="button" data-act="editVis" data-id="${x.vis.id}">Editar</button></div>`:''}</div></div>`).join('')}</div>
    ${url?`<a class="btn dark" href="${url}" target="_blank" rel="noopener">Abrir rota no Maps</a>`:''}
    <button class="btn sm ghost" type="button" data-act="visFor" data-id="${fid}">+ Encaixar visita / reunião</button></div>`}).join('');
  const all=dedupe(fids.flatMap(f=>routeStops(f,d)).sort((a,b)=>a.t.localeCompare(b.t)).map(x=>x.o).filter((o,i,arr)=>arr.findIndex(z=>z.id===o.id)===i));
  const allUrl=mapsUrl(all);
  return `<div class="toolbar"><h2 class="vt">Rotas de obras</h2><span class="grow"></span>${datebox(fLong(d),'dPrev','dNext','dToday')}</div>
  <div class="toolbar"><span class="hint">Saída: <b>${esc(S.cfg.partida||'localização atual do celular')}</b></span><button class="btn sm ghost" type="button" data-act="cfg">Alterar ponto de saída</button><span class="grow"></span><button class="btn pri" type="button" data-act="novaVis">+ Visita / reunião</button>${all.length>1&&allUrl?`<a class="btn dark" href="${allUrl}" target="_blank" rel="noopener">Rota completa (${all.length} obras)</a>`:''}</div>
  ${cards?`<div class="cards">${cards}</div>`:`<div class="empty">Ninguém alocado e nenhuma visita em ${fShort(d)}. Monte a programação na aba <a class="lnk" href="#dia">Dia</a> ou encaixe uma visita.</div>`}`;
}

function vEquipe(){
  if(!S.loaded.equipe)return '<p class="muted">Carregando…</p>';
  const eq=[...S.equipe].sort((a,b)=>(a.ativo===false)-(b.ativo===false)||isBoss(b)-isBoss(a)||String(a.nome).localeCompare(b.nome));
  const t=today();
  return `<div class="toolbar"><h2 class="vt">Equipe de elétrica</h2><span class="grow"></span><button class="btn pri" type="button" data-act="novoFunc">+ Funcionário</button></div>
  ${eq.length?`<div class="cards">${eq.map(f=>{const hj=S.aloc.filter(a=>a.data===t&&a.funcId===f.id).map(a=>obra(a.obraId)).filter(Boolean);return `<div class="card ${f.ativo===false?'off':''} ${isBoss(f)?'bosscard':''}">${isBoss(f)?'<span class="crown">Responsável pelo painel</span>':''}<h4>${esc(f.nome)}<button class="btn sm ghost" type="button" data-act="editFunc" data-id="${f.id}">Editar</button></h4>

  ${f.telefone?`<div>Tel: <span style="user-select:all">${esc(f.telefone)}</span></div>`:''}
  ${f.obs?`<div class="hint">${esc(f.obs)}</div>`:''}
  <div class="meta" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span class="lab">Hoje</span>${hj.length?hj.map(o=>`<span class="pill o" style="--oc:${ocor(o)}">${esc(o.nome)}</span>`).join(''):'<span class="hint">disponível</span>'}</div></div>`}).join('')}</div>`:'<div class="empty">Nenhum funcionário cadastrado. Use “+ Funcionário”.</div>'}`;

function vObras(){
  if(!S.loaded.obras)return '<p class="muted">Carregando…</p>';
  const obs=[...S.obras].sort((a,b)=>(a.ativa===false)-(b.ativa===false)||(a.ordem??99)-(b.ordem??99)||String(a.nome).localeCompare(b.nome));
  const t=today();
  return `<div class="toolbar"><h2 class="vt">Obras</h2><span class="grow"></span><button class="btn pri" type="button" data-act="novaObra">+ Obra</button></div>
  ${obs.length?[...FASES,['',''],['__off','Inativas']].map(([fk,fl])=>{const g=obs.filter(o=>fk==='__off'?o.ativa===false:o.ativa!==false&&(fk?o.fase===fk:!FASES.some(x=>x[0]===o.fase)));if(!g.length)return'';return `<section class="grp"><h3>${fl||'Sem fase'}</h3><div class="cards">${g.map(o=>{const n=new Set(S.aloc.filter(a=>a.data===t&&a.obraId===o.id).map(a=>a.funcId)).size;const dm=S.dem.filter(d=>d.obraId===o.id&&d.status!=='concluida');const u=dm.filter(d=>d.urgente).length;const url=o.endereco?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(o.endereco):'';
  return `<div class="card ${o.ativa===false?'off':''}" style="--oc:${ocor(o)}"><h4><span style="display:flex;gap:8px;align-items:center"><span class="sw"></span>${esc(o.nome)}</span><button class="btn sm ghost" type="button" data-act="editObra" data-id="${o.id}">Editar</button></h4>

  <div style="display:flex;gap:6px;flex-wrap:wrap"><span class="pill">${n} hoje</span><span class="pill">${dm.length} demanda${dm.length===1?'':'s'}</span>${u?`<span class="pill urg">${u} urgente${u>1?'s':''}</span>`:''}</div>

  const f=$('#mf');f.addEventListener('submit',async e=>{e.preventDefault();const r=await onSubmit(new FormData(f),f);if(r!==false)closeModal()});
  const first=f.querySelector('input,select,textarea');first&&first.focus();
}

document.addEventListener('click',e=>{
  const pk=e.target.closest('[data-pick]');const el=e.target.closest('[data-act]');
  if(el&&el.dataset.act==='closeOv'&&e.target!==el)return void 0;
  if(el){const a=el.dataset.act,id=el.dataset.id;
    const fns={
      close:closeModal,closeOv:closeModal,cancelSel:()=>{S.sel=null;render()},
      dPrev:()=>{S.day=add(S.day,-1);render()},dNext:()=>{S.day=add(S.day,1);render()},dToday:()=>{S.day=today();render()},
      wPrev:()=>{S.week=add(S.week,-7);render()},wNext:()=>{S.week=add(S.week,7);render()},wToday:()=>{S.week=ds(monday(new Date()));render()},
      mPrev:()=>{const d=pd(S.month+'-01');d.setMonth(d.getMonth()-1);S.month=ds(d).slice(0,7);render()},mNext:()=>{const d=pd(S.month+'-01');d.setMonth(d.getMonth()+1);S.month=ds(d).slice(0,7);render()},mToday:()=>{S.month=today().slice(0,7);render()},
      goDay:()=>{S.day=el.dataset.d;go('dia')},
      turno:()=>cycleTurno(id),unaloc:()=>delAloc(id),
      copyPrev:()=>copyDay(prevWorkday(S.day),S.day),copyWeek,
      cell:()=>mCell(el.dataset.f,el.dataset.d),
      novaDem:()=>mDem(),editDem:()=>mDem(id),agendar:()=>mAgendar(id),concluir:()=>concluir(id),reabrir:()=>reabrir(id),urg:()=>toggleUrg(id),desagendar:()=>desagendar(id),
      pickDem:()=>{S.sel={t:'dem',id};render()},
      novaVis:()=>mVis(null,{obraId:el.dataset.obra}),visFor:()=>mVis(null,{funcId:id}),editVis:()=>mVis(id),visDone:()=>visDone(id),novoFunc:()=>mFunc(),editFunc:()=>mFunc(id),novaObra:()=>mObra(),editObra:()=>mObra(id),cfg:mCfg
    };
    if(fns[a]){e.stopPropagation();fns[a]();return}
  }
  const tgt=e.target.closest('[data-drop]');
  if(S.sel&&tgt&&!pk){const z=tgt.dataset.drop;const s=S.sel;S.sel=null;
    if(z==='livre'){if(s.t==='aloc')delAloc(s.id)}
    else if(z==='fila'){}
    else{if(s.t==='func')assignFunc(s.id,z,S.day);else if(s.t==='aloc')moveAloc(s.id,z);else if(s.t==='dem')mAgendar(s.id,S.day,z)}
    render();return}
  if(pk){const[t,id]=pk.dataset.pick.split(':');S.sel=S.sel&&S.sel.id===id?null:{t,id};render()}
});
document.addEventListener('dragstart',e=>{const d=e.target.closest&&e.target.closest('[data-drag]');if(!d)return;e.dataTransfer.setData('text/plain',d.dataset.drag);e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(!z)return;e.preventDefault();document.querySelectorAll('.drop').forEach(x=>x!==z&&x.classList.remove('drop'));z.classList.add('drop')});

document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(!z)return;e.preventDefault();z.classList.remove('drop');
  const[t,id]=(e.dataTransfer.getData('text/plain')||'').split(':');const k=z.dataset.drop;if(!id)return;
  if(k==='livre'){if(t==='aloc')delAloc(id);return}
  if(k==='fila'){if(t==='dem'){const d=S.dem.find(x=>x.id===id);if(d&&d.status==='agendada')desagendar(id)}return}
  if(t==='func')assignFunc(id,k,S.day);else if(t==='aloc')moveAloc(id,k);else if(t==='dem')scheduleDem(id,S.day,k,null,false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modalRoot').innerHTML)closeModal();else if(S.sel){S.sel=null;render()}}});

  const clean=v=>JSON.parse(JSON.stringify(v));
  const docRef=p=>{const r=rdb.ref(FB_BASE+p);return{set:v=>r.set(clean(v)),update:v=>r.update(clean(v)),delete:()=>r.remove(),onSnapshot:(cb,err)=>r.on('value',s=>cb({exists:s.exists(),data:()=>s.val()}),err)}};
  return{rdb,doc:docRef,collection:c=>({doc:id=>docRef(c+'/'+id),onSnapshot:(cb,err)=>rdb.ref(FB_BASE+c).on('value',s=>{const docs=[];s.forEach(ch=>{docs.push({id:ch.key,data:()=>ch.val()})});cb({docs})},err)})};
}
const SEED={
  obras:{anchieta:{nome:"Obra Anchieta",sigla:"ANC",endereco:"",cor:"#3d5a80",fase:"execucao",ordem:1,ativa:true},
    essence:{nome:"Essence Residence",sigla:"ESS",endereco:"",cor:"#4a7a5f",fase:"execucao",ordem:2,ativa:true},
    "vista-park":{nome:"Vista Park",sigla:"VP",endereco:"Rua José Monteiro Filho, 166 – Jardim do Mar, São Bernardo do Campo – SP",cor:"#a0573a",fase:"finalizacao",ordem:3,ativa:true},
    belize:{nome:"Belize Residence",sigla:"BLZ",endereco:"",cor:"#6b5b95",fase:"bicos",ordem:4,ativa:true},
    zenith:{nome:"Zenith Residence",sigla:"ZEN",endereco:"Av. Imperatriz Leopoldina, 508",cor:"#8c7632",fase:"proxima",ordem:5,ativa:true},
    dom:{nome:"Dom Residence",sigla:"DOM",endereco:"",cor:"#3f7f8c",fase:"proxima",ordem:6,ativa:true}},
  equipe:{luciano:{nome:"Luciano",funcao:"Engenheiro Elétrico",telefone:"",obs:"Encarregado de elétrica",ativo:true},
    neilton:{nome:"Neilton",funcao:"Eletricista",telefone:"",obs:"",ativo:true},
    bilu:{nome:"Bilu",funcao:"Eletricista",telefone:"",obs:"",ativo:true}}
};
async function seedIfEmpty(db){try{const s=await db.rdb.ref(FB_BASE+'obras').once('value');if(!s.exists()){await db.rdb.ref(FB_BASE+'obras').set(SEED.obras);const e=await db.rdb.ref(FB_BASE+'equipe').once('value');if(!e.exists())await db.rdb.ref(FB_BASE+'equipe').set(SEED.equipe)}}catch(e){console.warn(e)}}

/* ---------- dados ---------- */
async function boot(){
  render();
  let db=null;
  if(window.firebase){try{db=fbDB();seedIfEmpty(db)}catch(e){console.error(e)}}
  else if(window.claude&&window.claude.use)db=await window.claude.use('db');
  if(!db){S.offline=true;render();return}
  S.db=db;
  const onErr=e=>{if(e&&e.code!=='unavailable')toast('Conexão com os dados interrompida. Recarregue a página.')};
  for(const [c,k] of [['equipe','equipe'],['obras','obras'],['alocacoes','aloc'],['demandas','dem'],['visitas','vis']]){
    db.collection(c).onSnapshot(q=>{S[k]=q.docs.map(d=>({id:d.id,...d.data()}));S.loaded[k]=S.loaded[c]=true;render()},onErr);
  }
  db.doc('config/geral').onSnapshot(s=>{S.cfg=s.exists?s.data():{};render()},onErr);
}
boot();
</script>
